<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

</head>
<body>

  <article>
    <img class="nft" src="./images/image-equilibrium.jpg" alt="Equilibrium" />    
    <h2>Equilibrium #3429</h2>
    <p>Our Equilibrium collection promotes balance and calm.</p>
    


  <div class="nft-info">
    <div class="nft-price"> 
    <img src="./images/icon-ethereum.svg" alt="Ethereum" /> <strong>0.041 ETH</strong> </div>
    <div class="nft-time"> 
      <img src="./images/icon-clock.svg" alt="Clock" />  3 days left </div>
  </div>

  <hr>

  <div class="nft-creator"> 
    <img class="nft-avatar" src="images/image-avatar.png" alt="Avatar" /> 
    <p>Creation of <strong>Jules Wyvern</strong> </p>
    </div>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a> </footer>

  </article>

</body>
</html>
